<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصمم البحوث المدرسية الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;700;900&family=Changa:wght@400;700;800&family=Mada:wght@400;700;900&family=Reem+Kufi:wght@400;700&family=El+Messiri:wght@400;700&family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#17261f;--mute:#5d6f66;--line:#d9e3dd;--brand:#0b6b4a;--brand2:#e8f3ee;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221d;--ink:#e8f1ec;--mute:#9db1a6;--line:#2a3a33;--brand:#3fbf8c;--brand2:#1d3028;--onbrand:#08150f}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#17221d;--ink:#e8f1ec;--mute:#9db1a6;--line:#2a3a33;--brand:#3fbf8c;--brand2:#1d3028;--onbrand:#08150f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.7}
header{padding:56px 20px 8px;max-width:960px;margin:auto}
h1{margin:0 0 4px;font-size:28px;font-weight:800}
header p{margin:0;color:var(--mute)}
main{max-width:960px;margin:auto;padding:12px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.full{grid-column:1/-1}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--brand);color:var(--onbrand)}
button.sec{background:var(--brand2);color:var(--brand)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#status{color:var(--mute);font-size:14px}
.err{color:#c0392b}
#out{overflow-x:auto}
.page{width:794px;height:1123px;overflow:hidden;background:#fff;color:#1b2a23;margin:0 auto 16px;padding:70px 64px 90px;position:relative;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--pf,'Tajawal',Tahoma,sans-serif);direction:rtl;border-top:10px solid var(--pc)}
.page h2{font-size:26px;color:var(--pc);margin:0 0 14px;border-bottom:2px solid var(--pl);padding-bottom:8px}
.page h3{font-size:19px;color:var(--pc);margin:16px 0 6px}
.page p,.page li{font-size:calc(17px*var(--k,1));line-height:var(--lh,2);margin:0 0 8px;text-align:justify}
.page ul,.page ol{padding-right:22px;margin:0 0 8px}
.cover{text-align:center;display:flex;flex-direction:column;align-items:center;}
.cover .top{font-size:16px;line-height:1.9;font-weight:700;margin-top:18px}
.cover .ttl{font-family:'Amiri',serif;font-size:44px;color:var(--pc);margin:120px 0 20px;line-height:1.5;padding:0 20px}
.cover .sub{font-size:20px;margin-bottom:90px;color:#3d5249}
.cover table{border-collapse:collapse;font-size:18px;margin-top:auto;margin-bottom:30px;width:80%}
.cover td{padding:9px 12px;border:1px solid var(--pl);text-align:right}
.cover td:first-child{background:var(--pl2);font-weight:700;width:38%}
.fn{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:13px;color:#7a8c83}
.toc .it{display:flex;justify-content:space-between;border-bottom:1px dotted var(--pc);padding:7px 0;font-size:18px}
.note{font-size:14px;color:var(--mute);margin-top:8px}
.ai-box{background:var(--brand2);border:1px solid var(--brand);padding:12px;border-radius:10px;margin-top:10px}
.page{--pc:#0b6b4a;--pl:#cfe5da;--pl2:#e8f3ee}
.h-bar h2{border-bottom:0;border-right:8px solid var(--pc);padding:5px 14px;background:var(--pl2)}
.h-fill h2{background:var(--pc);color:#fff;border:0;padding:8px 16px;border-radius:8px}
.cv-a{outline:3px double var(--pc);outline-offset:-26px}
.cv-b{border-top:0}
.cv-b .top{margin:-70px -64px 0;width:calc(100% + 128px);padding:50px 64px 30px;background:var(--pc);color:#fff}
.cv-b .ttl{margin-top:90px}
.cv-c{border:14px solid var(--pc);outline:2px solid var(--pc);outline-offset:-30px}
.cv-c .ttl{background:var(--pl2);padding:34px 20px;border-radius:14px;width:100%}
.cv-d{border-top:0;border-right:46px solid var(--pc);border-left:6px solid var(--pl)}
.cover{padding-bottom:50px}
.h-under h2{border-bottom:0;position:relative;padding-bottom:12px}
.h-under h2::after{content:"";position:absolute;right:0;bottom:0;width:90px;height:5px;background:var(--pc);border-radius:3px}
.h-box h2{border:2px solid var(--pc);border-radius:12px;padding:8px 16px;background:var(--pl2)}
.bgt{background:linear-gradient(180deg,var(--pl2) 0,#fff 150px)}
.bgf::before{content:"";position:absolute;inset:18px;border:1.5px solid var(--pl);pointer-events:none}
.hero{width:78%;height:220px;object-fit:cover;border-radius:14px;margin-top:26px;border:3px solid var(--pc)}
.hasimg .ttl{margin:26px 0 12px;font-size:38px}
.hasimg .sub{margin-bottom:22px}
.cv-c .hero{width:88%}
.cv-e{border-top:0;padding-top:0}
.cv-e:not(.hasimg){border-top:10px solid var(--pc);padding-top:70px}
.cv-e .hero{order:-1;width:calc(100% + 128px);max-width:none;margin:0 -64px;height:320px;border:0;border-bottom:10px solid var(--pc);border-radius:0}
.cv-e.hasimg .top{margin-top:26px}
.cv-f{border-top:0;padding-top:60px;background:linear-gradient(var(--pl2),#fff 55%)}
.cv-f .hero{width:230px;height:230px;border-radius:50%;border:8px solid var(--pc);margin:22px 0 4px}
.fig{margin:10px 0 14px;text-align:center}
.fig img{width:100%;height:var(--fh,230px);object-fit:cover;border-radius:10px;border:2px solid var(--pl)}
.fig figcaption{font-size:14px;color:#5d6f66;margin-top:4px}
.slide{width:1280px;height:720px;overflow:hidden;background:#fff;color:#1b2a23;margin:0 auto 16px;position:relative;direction:rtl;font-family:var(--pf,'Tajawal',Tahoma,sans-serif);box-shadow:0 2px 14px rgba(0,0,0,.18);--pc:#0b6b4a;--pl:#cfe5da;--pl2:#e8f3ee}
.slide .bar{position:absolute;top:0;right:0;left:0;height:12px;background:var(--pc)}
.slide .hd{padding:34px 60px 0}.slide h2{margin:0;font-size:42px;color:var(--pc);font-weight:800;line-height:1.3}
.slide .hd::after{content:"";display:block;width:110px;height:6px;background:var(--pc);border-radius:3px;margin-top:10px}
.slide .sb{position:absolute;top:150px;bottom:70px;right:60px;left:60px;font-size:30px;line-height:1.7;overflow:hidden}
.slide ul{margin:0;padding-right:30px}.slide li{margin-bottom:.45em}
.slide .pn{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:16px;color:#7a8c83}
.s-cover{background:linear-gradient(135deg,var(--pc),#000 230%);color:#fff;display:flex;align-items:center}
.s-cover .ct{padding:0 80px;flex:1}.s-cover h1{font-size:58px;margin:0 0 16px;line-height:1.35}.s-cover p{font-size:25px;opacity:.9;margin:0 0 8px}
.s-cover img{width:44%;height:100%;object-fit:cover}
.s-sec{background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.s-sec h2{color:#fff;font-size:60px}.s-sec p{font-size:28px;opacity:.9;margin:14px 0 0}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .ov{position:absolute;bottom:0;right:0;left:0;padding:60px 60px 50px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.slide .ov h2{color:#fff}.slide .ov p{font-size:26px;margin:10px 0 0}
.sg{display:grid;gap:22px;height:100%}
.c2{background:var(--pl2);border-radius:16px;padding:18px 22px;border-top:6px solid var(--pc);overflow:hidden}
.c2 h3{margin:0 0 .3em;color:var(--pc);font-size:1.05em}.c2 p{margin:0;font-size:.8em;line-height:1.6}.c2 li{font-size:.85em}
.st{display:flex;flex-direction:column;justify-content:center;text-align:center}.st b{font-size:2.2em;color:var(--pc);line-height:1.2}
.c2 i{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:50%;background:var(--pc);color:#fff;font-style:normal;margin-bottom:.4em;font-size:.9em}
.q{display:flex;flex-direction:column;justify-content:center;height:100%;font-size:1.2em;line-height:1.8;border-right:10px solid var(--pc);background:var(--pl2);border-radius:12px;padding:20px 34px}
.q small{display:block;font-size:.6em;color:#5d6f66;margin-top:.5em}
.si{width:100%;height:100%;object-fit:cover;border-radius:16px;border:3px solid var(--pc)}
.stb{width:100%;border-collapse:collapse;font-size:.8em}.stb th{background:var(--pc);color:#fff;padding:10px}.stb td{border:1px solid var(--pl);padding:10px;text-align:center}.stb tr:nth-child(even) td{background:var(--pl2)}
.page.sum{padding:34px 40px 44px;font-size:calc(13px*var(--k,1));line-height:1.7}
.sum .sh{display:flex;justify-content:space-between;align-items:center;background:var(--pc);color:#fff;border-radius:12px;padding:14px 20px;margin-bottom:10px}
.sum h1{margin:0;font-size:1.7em;line-height:1.3}.sum .sh span{font-size:.85em;opacity:.9}
.sum p,.sum li{font-size:1em;line-height:1.7;margin:0 0 3px;text-align:justify}
.sum .sin{background:var(--pl2);border-radius:10px;padding:8px 14px;margin-bottom:10px}
.sum h3{font-size:1.05em;color:var(--pc);margin:0 0 4px}
.sum .scol{columns:2;column-gap:12px;margin-bottom:10px}
.sum .sbx{background:#fff;border:1.5px solid var(--pl);border-top:4px solid var(--pc);border-radius:10px;padding:8px 12px;margin-bottom:10px;break-inside:avoid}
.sum .srow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum .rem{background:var(--pl2);border-right:6px solid var(--pc);border-radius:10px;padding:8px 14px;margin-bottom:10px}
.sum ul,.sum ol{margin:0;padding-right:20px}
.sum .sim{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.sum .sinfo{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.95em;border-bottom:1px dashed var(--pc);padding-bottom:6px;margin-bottom:8px;color:#3d5249}
.sum .simr{display:flex;gap:10px;margin-bottom:8px}.sum .simr .sim{flex:1;min-width:0;width:auto;margin:0}
.sum .sbx{padding:6px 10px;margin-bottom:8px}
.sum .stbl{width:100%;border-collapse:collapse;font-size:.95em}.sum .stbl th{background:var(--pc);color:#fff;padding:3px 6px}.sum .stbl td{border:1px solid var(--pl);padding:3px 6px;text-align:center}
.sum .sim.map{object-fit:contain;background:#fff;border:1.5px solid var(--pl);flex:1.5}
.sum .cpt{display:flex;gap:8px;align-items:flex-start}
.sum .cpt>div:last-child{flex:1;min-width:0}
.sum .cpt img,.sum .ic{flex:0 0 auto;width:calc(var(--ci,56px)*var(--k,1));height:calc(var(--ci,56px)*var(--k,1));border-radius:10px;object-fit:cover;border:1.5px solid var(--pl)}
.sum .ic{background:var(--pl2);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ci,56px)*.5*var(--k,1));line-height:1}
.page{--ac:#d9a441;--dk:#14201b}
.cv-g{background:linear-gradient(var(--pc) 0 52%,#fff 52%)}
.cv-g .top,.cv-g .ttl{color:#fff}.cv-g .ttl{margin-top:70px}.cv-g .sub{color:var(--pl)}
.cv-h{background:var(--dk);color:#fff}
.cv-h .top,.cv-h .sub{color:var(--pl)}.cv-h .ttl{color:#fff}
.cv-h td{color:#fff;background:transparent!important;border-color:var(--pc)}
.cv-h td:first-child{background:var(--pc)!important}
.cv-i{background:repeating-linear-gradient(135deg,var(--pl2) 0 22px,#fff 22px 44px)}
.cv-j{border:16px solid var(--pc);outline:4px solid var(--ac);outline-offset:-44px}
.cv-j .ttl{color:var(--pc)}
.h-stripe h2{background:var(--pc);color:#fff;border:0;margin:0 -64px 16px;padding:10px 64px}
.h-chip h2{display:inline-block;border:0;background:var(--pl2);color:var(--pc);padding:4px 18px;border-radius:999px}
.h-slant h2{background:linear-gradient(90deg,var(--pc),var(--ac));color:#fff;border:0;padding:8px 18px;border-radius:0 0 18px 0}
.bgd{background-color:#fff;background-image:radial-gradient(var(--pl) 1.2px,transparent 1.3px);background-size:22px 22px}
.bgs{background:repeating-linear-gradient(0deg,#fff 0 30px,var(--pl2) 30px 31px)}
.bgr{background:radial-gradient(circle at 100% 0,var(--pl2),#fff 60%)}


/* ===== طبقة التصميم الجديدة للواجهة والمخرجات ===== */
:root{
  --bg:#eef2f8;--card:#ffffff;--ink:#17243b;--mute:#68768d;--line:#dce4f0;
  --brand:#4d5fd0;--brand2:#edf0ff;--onbrand:#ffffff;
  --shadow:0 14px 38px rgba(29,48,89,.09);--shadow-strong:0 22px 55px rgba(25,42,78,.15);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101827;--card:#182438;--ink:#edf3ff;--mute:#a5b3ca;--line:#2b3a52;
    --brand:#8795ff;--brand2:#263252;--onbrand:#101827;
    --shadow:0 14px 38px rgba(0,0,0,.22);--shadow-strong:0 22px 55px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101827;--card:#182438;--ink:#edf3ff;--mute:#a5b3ca;--line:#2b3a52;
  --brand:#8795ff;--brand2:#263252;--onbrand:#101827;
  --shadow:0 14px 38px rgba(0,0,0,.22);--shadow-strong:0 22px 55px rgba(0,0,0,.32);
  color-scheme:dark;
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background-color:var(--bg);
  background-image:radial-gradient(ellipse at 8% 4%,rgba(91,112,220,.13),transparent 34%),
                   radial-gradient(ellipse at 94% 18%,rgba(34,177,166,.10),transparent 30%),
                   linear-gradient(145deg,transparent 55%,rgba(106,129,190,.035));
  color:var(--ink);font-family:'Tajawal','Cairo',Tahoma,Arial,sans-serif;letter-spacing:.05px;
}
header{max-width:1020px;padding:76px 24px 20px;position:relative}
header::before{
  content:"منصة تعليمية متكاملة";display:inline-flex;align-items:center;gap:8px;
  padding:6px 13px;margin-bottom:13px;border:1px solid rgba(91,112,220,.2);
  border-radius:999px;background:var(--brand2);color:var(--brand);
  font-size:12px;font-weight:800;letter-spacing:.3px;
}
header h1{
  margin:0 0 9px;font-family:'Cairo','Tajawal',sans-serif;font-size:clamp(27px,4vw,36px);
  font-weight:900;line-height:1.35;letter-spacing:-.6px;color:var(--ink);
}
header p{max-width:760px;color:var(--mute);font-size:15px;line-height:1.9}
header .note{display:inline-block;margin-right:5px;color:var(--brand);font-weight:800}
main{max-width:1020px;padding:14px 24px 76px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:24px;margin-bottom:20px;box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:focus-within{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--shadow-strong)}
.grid{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:17px 16px}
label{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:7px}
input,select,textarea{
  min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;
  background:color-mix(in srgb,var(--bg) 52%,var(--card));color:var(--ink);
  font-family:'Tajawal','Cairo',Tahoma,sans-serif;font-size:15px;line-height:1.5;
  box-shadow:inset 0 1px 2px rgba(18,35,65,.025);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
textarea{min-height:82px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.75}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--brand);background:var(--card);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent);
}
button{
  min-height:45px;padding:11px 19px;border-radius:13px;
  background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 78%,#20b7ae));
  color:var(--onbrand);font-weight:800;letter-spacing:.1px;
  box-shadow:0 7px 16px color-mix(in srgb,var(--brand) 22%,transparent);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
button:hover:not(:disabled){transform:translateY(-2px);filter:saturate(1.08);box-shadow:0 11px 22px color-mix(in srgb,var(--brand) 27%,transparent)}
button:active:not(:disabled){transform:translateY(0);box-shadow:0 4px 10px color-mix(in srgb,var(--brand) 18%,transparent)}
button.sec{background:var(--brand2);color:var(--brand);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 13%,transparent)}
button.sec:hover:not(:disabled){background:color-mix(in srgb,var(--brand2) 78%,var(--brand));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 25%,transparent),0 8px 16px rgba(30,45,90,.08)}
button:disabled{opacity:.55;filter:grayscale(.15)}
#acctBtn{border:1px solid rgba(255,255,255,.28);border-radius:999px;box-shadow:0 8px 22px rgba(25,38,83,.2);backdrop-filter:blur(12px)}
#profBox{border-radius:18px!important;background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow-strong)!important}
.ai-box{border:1px solid color-mix(in srgb,var(--brand) 28%,var(--line));border-radius:16px;background:linear-gradient(135deg,var(--brand2),color-mix(in srgb,var(--card) 65%,var(--brand2)));padding:17px}
.ai-box label{color:var(--brand)!important;font-size:14px}
.note{color:var(--mute);line-height:1.7}
#status,#pstatus{font-weight:700}
.err{color:#d04455}
#histBox,#actions{border-style:solid}
#out{overflow-x:auto;padding:8px 0 26px;scrollbar-color:var(--brand2) transparent}

/* صفحات البحث: تبقى مساحة A4 الفعلية 794 × 1123 بكسل */
.page{
  width:794px;height:1123px;overflow:hidden;background:#fff;color:#202b40;
  margin:0 auto 22px;padding:70px 64px 90px;position:relative;
  box-shadow:0 16px 42px rgba(18,31,60,.16),0 2px 8px rgba(18,31,60,.08);
  font-family:var(--pf,'Tajawal',Tahoma,sans-serif);direction:rtl;
}
.page h2{font-size:27px;font-weight:900;letter-spacing:-.2px;color:var(--pc);margin:0 0 17px;border-bottom:2px solid var(--pl);padding-bottom:10px;line-height:1.5}
.page h3{font-size:20px;font-weight:800;color:var(--pc);margin:18px 0 7px}
.page p,.page li{font-size:calc(17px*var(--k,1));line-height:var(--lh,2);margin:0 0 9px;text-align:justify;color:#263348}
.page ul,.page ol{padding-right:24px;margin:0 0 10px}
.page li::marker{color:var(--pc);font-weight:800}
.cover{padding-bottom:50px;text-align:center}
.cover .top{font-size:16px;line-height:2;font-weight:800;margin-top:20px;color:var(--pc)}
.cover .ttl{
  font-family:'Amiri',serif;font-size:45px;font-weight:700;color:var(--pc);
  margin:112px 0 18px;line-height:1.55;padding:0 24px;position:relative;
}
.cover .ttl::after{content:"";display:block;width:92px;height:5px;border-radius:99px;background:var(--pc);opacity:.8;margin:16px auto 0}

function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sx=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;sx=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return [h,sx*100,l*100];
}
function customTheme(hex){

  const pick=l=>l[Math.floor(rnd()*l.length)];

}
const SKIPK=['layout','img','icon','imgQ','theme','kind'];
const isEng=()=>/الإنجليزية|English/.test($('subject').value);
function cleanText(t,eng){ // ينظّف النص من بقايا الأكواد والرموز الغريبة، ويرفض النص التالف
  let x=String(t==null?'':t);
  x=x.replace(/```[\s\S]*?```/g,' ').replace(/<[^>]{1,60}>/g,' ').replace(/\*\*|__|`/g,'').replace(/^\s*#+\s*/gm,'').replace(/^\s*[-•*]\s+/,'')
     .replace(/\\["n]/g,' ').replace(/\b(undefined|null|NaN)\b|\[object Object\]/g,' ')
     .replace(/^[\s"'{\[,]+/,'').replace(/["'\s,}\]]+$/,function(m){return /[.!؟?)]/.test(m)?m:''});
  if(/[{}]|=>|<\/|\b(?:function|console|const|import|return)\b|https?:\/\/|"\s*:\s*|",\s*"|\["|"\]/.test(x))return '';
  if(!eng&&!/[\u0600-\u06FF]/.test(x))return '';
  const L=(x.match(/[A-Za-z\u0600-\u06FF]/g)||[]).length,la=(x.match(/[A-Za-z]/g)||[]).length;
  if(!eng&&L>=30&&la/L>0.4)return '';
  return x.replace(/\s{2,}/g,' ').trim();
}
function deepClean(o,k,eng){
  if(typeof o==='string')return SKIPK.includes(k)?o:cleanText(o,eng);
  if(Array.isArray(o))return o.map(v=>deepClean(v,k,eng)).filter(v=>!(typeof v==='string'&&!v));
  if(o&&typeof o==='object'){const r={};for(const q in o)r[q]=deepClean(o[q],q,eng);return r}
  return o;
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const m=String(t).match(/\{[\s\S]*\}/);
  if(m)return JSON.parse(m[0]);
  throw new Error('رد غير مفهوم من النموذج');
}

// استدعاء Groq: النموذج الأقوى أولاً ثم الأسرع، مع إعادة المحاولة عند ضغط الطلبات
let MODELS=null;
async function getModels(){
  if(MODELS)return MODELS;
  const pref=["llama-3.3-70b-versatile","meta-llama/llama-4-scout-17b-16e-instruct","moonshotai/kimi-k2-instruct-0905","llama-3.1-8b-instant","openai/gpt-oss-120b","openai/gpt-oss-20b"];
  try{
    const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{Authorization:`Bearer ${GROQ_API_KEY}`}});
    if(!r.ok)throw new Error('models '+r.status);
    const ids=(await r.json()).data.map(m=>m.id);
    const ok=m=>!/whisper|orpheus|guard|tts|allam|compound|qwen/i.test(m);
    MODELS=[...pref.filter(m=>ids.includes(m)),...ids.filter(m=>ok(m)&&!pref.includes(m))];
    if(!MODELS.length)throw new Error('لا توجد نماذج متاحة لهذا المفتاح');
  }catch(e){if(/لا توجد/.test(e.message))throw e;MODELS=pref}
  return MODELS;
}

async function groq(messages,max=1800,valid){
  if(VB&&messages[0]&&messages[0].role==='system')messages=[{...messages[0],content:messages[0].content+VB},...messages.slice(1)];
  const models=await getModels();
  let last;
  for(let round=0;round<2;round++){
    let rate=false;
    for(const model of models){
      for(let a=0;a<3;a++){
        try{
          const body={model,messages,temperature:a>0?Math.max(0.3,TEMP-0.25):TEMP,top_p:0.95,max_tokens:/gpt-oss/.test(model)?max+1500:max};
          if(/gpt-oss/.test(model))body.reasoning_effort="low";
          if(a%2===0)body.response_format={type:"json_object"};
          const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
            method:"POST",
            headers:{"Authorization":`Bearer ${GROQ_API_KEY}`,"Content-Type":"application/json"},
            body:JSON.stringify(body)
          });
          if(res.ok){
            const j=await res.json();
            try{const pj=parseJSON(j.choices[0].message.content);if(valid&&!valid(pj)){last=new Error('رد غير صالح');continue}return pj}catch(pe){last=pe;continue}
          }
          const txt=(await res.text()).slice(0,160);
          last=new Error('خطأ '+res.status+' ['+model+']: '+txt);
          if(res.status===429){rate=true;break} // حصة هذا النموذج امتلأت: جرّب نموذجاً آخر
          if(res.status===400||res.status>=500)continue;
          break; // 401/403/404: انتقل للنموذج التالي
        }catch(e){last=e;await sleep(1500)}
      }
    }
    if(rate&&round===0){$('status').textContent='⏳ وصلنا حد الطلبات المؤقت، ننتظر قليلاً…';await sleep(20000)}else break;
  }
  throw last||new Error('فشل الاتصال');
}

function loadImg(url){return new Promise(res=>{
  const im=new Image();im.crossOrigin='anonymous';
  const t=setTimeout(()=>res(null),15000);
  im.onload=()=>{clearTimeout(t);try{
    const c=document.createElement('canvas');const r=Math.min(1,900/im.naturalWidth);
    c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.85));
  }catch(e){res(url)}};
  im.onerror=()=>{clearTimeout(t);res(null)};
  im.src=url;
})}
const STOPW=new Set(['the','and','of','in','with','for','on','an','to','from']);
async function findImage(q,w){ // يبحث بعبارة محددة ويقبل الصورة فقط إذا طابق اسمها كلمات البحث
  if(/الدراسات الإسلامية|القرآن|التربية الإسلامية|الدين|الفقه|الحديث|التوحيد|السيرة|التفسير/.test($('subject').value+' '+$('topic').value))return null;
  q=String(q||'').trim();if(!q||$('imgs').value==='none')return null;
  const words=q.toLowerCase().split(/\s+/).filter(x=>x.length>2&&!STOPW.has(x)).map(x=>x.replace(/s$/,''));
  if(!words.length)return null;
  const need=words.length<=3?words.length:Math.ceil(words.length*0.75);
  try{
    const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=30&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|mime|size&iiurlwidth='+(w||900);
    const j=await (await fetch(u)).json();
    const cand=Object.values((j.query&&j.query.pages)||{}).map(p=>{
      const ii=p.imageinfo&&p.imageinfo[0];if(!ii)return null;
      const t=p.title.toLowerCase();
      return {p,ii,sc:words.filter(x=>t.includes(x)).length};
    }).filter(c=>c&&/jpeg|png/.test(c.ii.mime)&&(c.ii.width||0)>=400&&!/logo|icon|flag|stub|commons-/i.test(c.p.title)&&c.sc>=need)
      .sort((a,b)=>b.sc-a.sc||a.p.index-b.p.index);
    for(const c of cand.slice(0,5)){
      const src=await loadImg(c.ii.thumburl||c.ii.url);
      if(src)return {src,title:c.p.title.replace(/^File:/,'').replace(/\.\w+$/,'')};
    }
  }catch(e){}
  return null;
}

async function getImages(qs,topic,cap){
  const want=Math.min(cap||99,{none:0,few:3,mid:6,many:10}[$('imgs').value]);
  if(!want)return [];
  try{
    qs=(Array.isArray(qs)?qs:[]).map(String).filter(Boolean).slice(0,5);
    if(!qs.length)qs=[topic];
    const per=Math.ceil((want+4)/qs.length)+1,seen=new Set();
    const lists=await Promise.all(qs.map(async q=>{
      const out=[];
      try{
        const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=900';
        const j=await (await fetch(u)).json();
        const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
        for(const p of pages){
          const ii=p.imageinfo&&p.imageinfo[0];
          if(!ii||!/jpeg|png/.test(ii.mime)||(ii.width||0)<500||/logo|icon|flag|stub|commons-/i.test(p.title))continue;
          out.push({url:ii.thumburl||ii.url,title:p.title.replace(/^File:/,'').replace(/\.\w+$/,'')});
          if(out.length>=per)break;
        }
      }catch(e){}
      return out;
    }));
    const cand=[];
    for(let k=0;k<per;k++)lists.forEach(l=>{if(l[k]&&!seen.has(l[k].title)){seen.add(l[k].title);cand.push(l[k])}});
    const loaded=await Promise.all(cand.slice(0,want+5).map(async c=>({title:c.title,src:await loadImg(c.url)})));
    return loaded.filter(x=>x.src).slice(0,want);
  }catch(e){return []}
}

let FIG={},CREDITS='';
const figHTML=(f,si)=>`<figure class="fig"><img src="${f.src}" style="height:${SZ(f.size).fh}px" crossorigin="anonymous"><figcaption>شكل (${N(f.k)}) — ${f.cap?esc(f.cap):'صورة توضيحية مرتبطة بموضوع «'+esc(DATA_SECS[si].h)+'»'}</figcaption></figure>`;
let DATA_SECS=[];
function blocksOf(s,si){
  const out=[{html:`<h2>${esc(s.h)}</h2>`,head:true,sec:si}];
  const isRef=s.kind==='ref';
  (s.paras||[]).forEach((p,pi)=>{out.push({html:`<p>${esc(p)}</p>`});if(pi===0&&FIG[si])out.push({html:figHTML(FIG[si],si)})});
  if(!(s.paras||[]).length&&FIG[si])out.push({html:figHTML(FIG[si],si)});
  const list=(b)=>(b||[]).length?[{html:(isRef?'<ol>':'<ul>')+b.map(x=>`<li>${esc(x)}</li>`).join('')+(isRef?'</ol>':'</ul>')}]:[];
  out.push(...list(s.bullets));
  if(isRef&&CREDITS)out.push({html:`<p style="font-size:14px">${CREDITS}</p>`});
  (s.subs||[]).forEach(u=>{
    if(u.h)out.push({html:`<h3>${esc(u.h)}</h3>`,head:true});
    (u.paras||[]).forEach(p=>out.push({html:`<p>${esc(p)}</p>`}));
    out.push(...list(u.bullets));
  });
  return out;
}

function render(d,th){
  const o=$('out'),P=d.targetPages;
  const set=(k,l)=>{o.style.setProperty('--k',k);o.style.setProperty('--lh',l)};
  set(1,2);
  if(!P){render0(d,th);return}
  const cnt=()=>o.querySelectorAll('.page').length;
  const run=(x,k,l)=>{set(k,l);render0(x,th);return cnt()};
  const dd={...d,images:[...(d.images||[])],sections:d.sections.map(s=>({...s,paras:[...(s.paras||[])],subs:(s.subs||[]).map(u=>({...u,paras:[...(u.paras||[])]}))}))};
  let lo=0.7,hi=1.3,best=0;
  for(let i=0;i<7;i++){const m=(lo+hi)/2;if(run(dd,m,2)<=P){best=m;lo=m}else hi=m}
  if(!best){ // أطول من المطلوب حتى بأصغر خط: احذف الصور الداخلية ثم آخر الفقرات
    dd.images=dd.images.slice(0,1);
    for(let g=0;run(dd,0.7,2)>P&&g<60;g++){
      const c=dd.sections.filter(s=>!s.kind).map(s=>({s,n:s.paras.length+s.subs.reduce((a,u)=>a+u.paras.length,0)})).sort((a,b)=>b.n-a.n)[0];
      if(!c||c.n<=1)break;
      const sub=[...c.s.subs].reverse().find(u=>u.paras.length);
      if(sub)sub.paras.pop();else c.s.paras.pop();
    }
  }else{ // أقصر من المطلوب: وسّع التباعد حتى تمتلئ الصفحات
    let bl=2;
    if(run(dd,best,2)<P){for(let l=2.1;l<=3.2;l+=0.1){if(run(dd,best,l)<=P)bl=l;else break}}
    run(dd,best,bl);
  }
}

        page=newPage();moved.forEach(m=>page.appendChild(m));
      }
      if(b.sec!==undefined)startPage[si]=null; // تحديد لاحقاً

function slideHTML(s,i,T){
  const E=esc,pn=`<div class="pn">${N(i+1)} / ${N(T)}</div>`,st=thStyle();
  const li=a=>`<ul>${(a||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
  const hd=`<div class="bar"></div><div class="hd"><h2>${E(s.title)}</h2></div>`;
  const wrap=b=>`<div class="slide" style="${st}">${hd}<div class="sb">${b}</div>${pn}</div>`;
  const cols=n=>`<div class="sg" style="grid-template-columns:repeat(${Math.max(1,Math.min(n,6))},1fr)">`;
  const L=s.layout;
  if(L==='section')return `<div class="slide s-sec" style="${st}"><div><h2>${E(s.title)}</h2><p>${E(s.text)}</p></div>${pn}</div>`;
  if(L==='bigimage'&&s._img)return `<div class="slide" style="${st}"><img class="bg" src="${s._img.src}"><div class="ov"><h2>${E(s.title)}</h2><p>${E(s.text)}</p></div>${pn}</div>`;
  if(L==='compare')return wrap(`<div class="sg" style="grid-template-columns:1fr 1fr">${[s.left,s.right].map(c=>`<div class="c2"><h3>${E(c&&c.h)}</h3>${li(c&&c.bullets)}</div>`).join('')}</div>`);
  if(L==='stats'){const a=(s.stats||[]).slice(0,4);return wrap(cols(a.length)+a.map(x=>`<div class="c2 st"><b>${E(x.v)}</b><span>${E(x.l)}</span></div>`).join('')+'</div>')}
  if(L==='quote')return wrap(`<div class="q">${E(s.text)}<small>${E(s.note)}</small></div>`);
  if(L==='steps'){const a=(s.steps||[]).slice(0,5);return wrap(cols(a.length)+a.map((x,k)=>`<div class="c2"><i>${N(k+1)}</i><h3>${E(x.h)}</h3><p>${E(x.t)}</p></div>`).join('')+'</div>')}
  if(L==='cards'){const a=(s.cards||[]).slice(0,6);return wrap(`<div class="sg" style="grid-template-columns:repeat(${a.length>4?3:Math.max(1,Math.min(a.length,3))},1fr)">`+a.map(x=>`<div class="c2"><h3>${E(x.h)}</h3><p>${E(x.t)}</p></div>`).join('')+'</div>')}
  if(L==='table'&&s.cols)return wrap(`<table class="stb"><tr>${s.cols.map(c=>`<th>${E(c)}</th>`).join('')}</tr>${(s.rows||[]).slice(0,5).map(r=>`<tr>${(Array.isArray(r)?r:[r]).map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')}</table>`);
  if(L==='image'&&s._img)return wrap(`<div class="sg" style="grid-template-columns:1.2fr 1fr"><div>${li(s.bullets)}</div><img class="si" src="${s._img.src}"></div>`);
  return wrap(li(s.bullets||(s.text?[s.text]:[])));
}

(()=>{
  const MIN=15,MAX=20; // كل مقطع يظهر من 15 إلى 20 ثانية، بالترتيب
  const FALLBACK=['bg1.mp4','bg2.mp4','bg3.mp4','bg4.mp4','bg5.mp4','bg6.mp4','bg10.mp4','bg11.mp4'];
  const slots=[...document.querySelectorAll('#animBg .bgslot')];
  if(!slots.length)return;
  // يكتشف تلقائياً أي مقطع bgN.mp4 موجود بجانب الصفحة (حتى رقم 60)، فتضيف أي مقطع جديد بنفس الاسم
  async function exists(url){try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return null}}
  async function discover(){
    const nums=[...Array(60).keys()].map(i=>i+1);
    const res=await Promise.all(nums.map(n=>exists(`bg${n}.mp4`)));
    if(res.every(r=>r===null))return FALLBACK; // الفتح من جهاز بدون إنترنت: نستخدم القائمة الثابتة
    const list=nums.filter((n,i)=>res[i]===true).map(n=>`bg${n}.mp4`);
    return list.length?list:FALLBACK;
  }
  let order=[],idx=-1,cur=-1;
  const pick=()=>{idx=(idx+1)%order.length;return order[idx]}; // بالترتيب، ثم يرجع للأول
  function load(v,name){
    v.onerror=()=>{if((v.getAttribute('src')||'').endsWith('.webm')){v.src=name;v.play().catch(()=>{})}};
    v.loop=true; // إذا كان المقطع أقصر من المدة يعيد نفسه
    v.src=name.replace(/\.mp4$/,'.webm');
    v.play().catch(()=>{});
  }
  function show(){
    const next=cur===0?1:0,slot=slots[next],old=cur>=0?slots[cur]:null;
    const name=pick();
    const main=slot.querySelector('.bgv'),fill=slot.querySelector('.bgfill');
    // المقطع العمودي يظهر كامل مع خلفية مموّهة، والأفقي يملأ الشاشة (يُحسب تلقائياً من أبعاد الفيديو)
    main.onloadedmetadata=()=>slot.classList.toggle('tall',main.videoHeight>main.videoWidth);
    load(fill,name);
    load(main,name);
    slot.classList.add('on');
    if(old){old.classList.remove('on');setTimeout(()=>old.querySelectorAll('video').forEach(v=>v.pause()),1300)}
    cur=next;
    $('animBg').classList.add('has-clips');
  }
  discover().then(list=>{
    order=list;
    (function next(){show();setTimeout(next,(MIN+Math.random()*(MAX-MIN))*1000)})();
  });
})();

function mindMap(d){ // مخطط ذهني يُرسم من أفكار الدرس نفسها (يعمل بدون إنترنت)
  const pc=TH.pc,pl2=TH.pl2,x=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
  const L=d.concepts.slice(0,6).map(c=>cut(c.h,26));
  const pos=[[640,38],[640,120],[640,202],[120,38],[120,120],[120,202]];
  let g='<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" direction="rtl" font-family="Tajawal,Tahoma,Arial,sans-serif">';
  L.forEach((t,i)=>{g+=`<line x1="380" y1="120" x2="${pos[i][0]}" y2="${pos[i][1]}" stroke="${pc}" stroke-width="2" opacity=".5"/>`});
  g+=`<ellipse cx="380" cy="120" rx="135" ry="42" fill="${pc}"/><text x="380" y="126" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">${x(cut(d.title,34))}</text>`;

  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(g+'</svg>');
}
function renderSummary(d,th){

  const fits=(c,k,dd)=>{o.style.setProperty('--k',k);o.innerHTML=sumHTML(dd,c);const pg=o.firstElementChild;return pg.scrollHeight<=pg.clientHeight+1};
  const dd={...d,concepts:[...d.concepts]};
  for(;;){ // الصور ثابتة؛ نصغّر الخط ثم نخفف الأسئلة ثم نقصّ آخر الأفكار

  const out=$('out');
  out.style.zoom=1; // إلغاء التكبير حتى تخرج الصفحات بحجمها الحقيقي
  const st=document.createElement('style');
  st.textContent=`@page{size:${SL?'1280px 720px':'210mm 297mm'};margin:0}`;
  document.head.appendChild(st);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');st.remove();fitOut();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),150);
  $('pstatus').textContent='في نافذة الطباعة اختر "حفظ كـ PDF" (Save as PDF)';
};
</script>
</body>
</html>
